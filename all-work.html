<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Work | PEEMPDESIGNER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ================= THEME VARIABLES ================= */
    :root {
      --orange: #f97316;
      --ink: #111827;
      --muted: #4b5563;
      --paper: #f9fafb;
      --bg-main: #f9fafb;
      --bg-card: #ffffff;
      --border-color: #e5e7eb;
      --heading-color: #111827;
      --nav-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg-main: #0d0f12;
      --bg-card: #161920;
      --paper: #161920;
      --ink: #f0f0f0;
      --muted: #a0a0a0;
      --border-color: #2a2d35;
      --heading-color: #ffffff;
      --nav-bg: #161920;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-main);
      color: var(--ink);
      font-family: "Inter", sans-serif;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ================= HEADER ================= */

    header {
      align-items: center;
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      padding: 20px 7%;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    header a {
      color: var(--heading-color);
      font-family: "Poppins", sans-serif;
      font-weight: 800;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--ink);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.3s ease;
      font-family: "Inter", sans-serif;
    }

    .theme-toggle:hover {
      border-color: var(--ink);
    }

    .back-link,
    .project-link {
      background: var(--ink);
      border-radius: 999px;
      color: var(--bg-main);
      font-family: "Inter", sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 13px 20px;
      text-decoration: none;
      transition: background-color 180ms ease, transform 180ms ease, color 0.3s ease;
    }

    .back-link:hover,
    .back-link:focus-visible,
    .project-link:hover,
    .project-link:focus-visible {
      background: var(--orange);
      color: #ffffff;
      transform: translateY(-3px);
    }

    /* ================= MAIN CONTENT ================= */

    main {
      margin: auto;
      max-width: 1300px;
      padding: 80px 7% 110px;
    }

    .intro {
      margin: auto auto 58px;
      max-width: 720px;
      text-align: center;
    }

    .tag {
      color: var(--orange);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    h1 {
      color: var(--heading-color);
      font-family: "Poppins", sans-serif;
      font-size: clamp(42px, 7vw, 82px);
      line-height: 1;
      margin-bottom: 20px;
      transition: color 0.3s ease;
    }

    .intro p {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
      transition: color 0.3s ease;
    }

    /* ================= WORK GRID ================= */

    .work-grid {
      display: grid;
      gap: 32px 24px;
      grid-template-columns: repeat(3, 1fr);
    }

    .work-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      transition: box-shadow 180ms ease, transform 180ms ease, background 0.3s ease, border-color 0.3s ease;
    }

    .work-card:hover {
      box-shadow: 0 14px 24px rgba(0, 0, 0, 0.25);
      transform: translateY(-7px);
    }

    .work-card img {
      background: #ffffff;
      display: block;
      height: 280px;
      object-fit: contain;
      padding: 18px;
      width: 100%;
    }

    .work-card-content {
      padding: 22px 24px 26px;
    }

    .work-card h2 {
      color: var(--heading-color);
      font-family: "Poppins", sans-serif;
      font-size: 20px;
      margin-bottom: 6px;
      transition: color 0.3s ease;
    }

    .work-card p {
      color: var(--muted);
      font-size: 13px;
      transition: color 0.3s ease;
    }

    .work-empty {
      color: var(--muted);
      text-align: center;
      padding: 60px 20px;
      grid-column: 1 / -1;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 800px) {
      .work-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 560px) {
      header {
        padding: 16px 20px;
      }

      header a:first-child {
        font-size: 14px;
      }

      .back-link {
        font-size: 12px;
        padding: 10px 14px;
      }

      .theme-toggle {
        font-size: 12px;
        padding: 6px 12px;
      }

      main {
        padding: 52px 20px 80px;
      }

      .intro p {
        font-size: 15px;
      }

      .work-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">PEEMPDESIGNER</a>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">
        <span id="themeIcon">🌙</span> <span id="themeText">Dark</span>
      </button>
      <a class="back-link" href="portfolio.html">← Back to Portfolio</a>
    </div>
  </header>

  <main>
    <section class="intro">
      <div class="tag">PORTFOLIO ARCHIVE</div>
      <h1>All My Work.</h1>
      <p>Explore the complete collection of branding, poster, logo, and social media projects.</p>
    </section>

    <section class="work-grid" id="workGrid">
      <div class="work-empty">Loading projects…</div>
    </section>
  </main>

  <!-- JAVASCRIPT -->
  <script>
    const toggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');
    const savedTheme = localStorage.getItem('theme');

    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      setTheme('dark');
    } else {
      setTheme('light');
    }

    toggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    function setTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('theme', t);
      themeIcon.textContent = t === 'dark' ? '☀️' : '🌙';
      themeText.textContent = t === 'dark' ? 'Light' : 'Dark';
    }

    // Same category labels used on the Portfolio page, so wording matches
    const CATEGORY_LABELS = {
      branding: "Brand Identity",
      logos: "Logo Design",
      posters: "Poster Design",
      social: "Social Media Design",
      web: "Web Design"
    };

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // --- LOAD ALL PROJECTS FROM THE SAME PORTFOLIO MANAGER ---
    // Any project added, edited, or removed in the admin panel (including
    // uploaded images) automatically appears here too, since this reads
    // from the exact same list as the Portfolio page.
    async function loadAllWork() {
      const grid = document.getElementById('workGrid');

      try {
        const res = await fetch('/api/portfolio-projects');
        if (!res.ok) throw new Error('Failed to load');
        const data = await res.json();
        const projects = data.projects || [];

        if (projects.length === 0) {
          grid.innerHTML = '<div class="work-empty">No projects yet.</div>';
          return;
        }

        grid.innerHTML = projects.map((p) => {
          const categoryLabel = CATEGORY_LABELS[p.category] || p.category;
          return `
            <article class="work-card">
              <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.title)}" />
              <div class="work-card-content">
                <h2>${escapeHtml(p.title)}</h2>
                <p>${escapeHtml(categoryLabel)}</p>
              </div>
            </article>
          `;
        }).join('');
      } catch (err) {
        grid.innerHTML = '<div class="work-empty">Could not load projects. Please refresh.</div>';
      }
    }

    loadAllWork();
  </script>
</body>
</html>
